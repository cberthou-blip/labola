name: Integration temporaire pages SEO

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Intégrer Yoga et Danse
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cours = Path('cours/index.html')
          text = cours.read_text(encoding='utf-8')
          old_yoga = '<a href="#famille-yoga"><strong>Cours de yoga à Clisson</strong>'
          new_yoga = '<a href="/yoga-clisson/"><strong>Cours de yoga à Clisson</strong>'
          old_danse = '<a href="#famille-danse"><strong>Cours de danse à Clisson</strong>'
          new_danse = '<a href="/danse-clisson/"><strong>Cours de danse à Clisson</strong>'
          if old_yoga not in text or old_danse not in text:
              raise SystemExit('Liens source non trouvés dans cours/index.html')
          text = text.replace(old_yoga, new_yoga, 1).replace(old_danse, new_danse, 1)
          cours.write_text(text, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          sm = sitemap.read_text(encoding='utf-8')
          if 'https://labola-clisson.fr/yoga-clisson/' not in sm:
              additions = '''  <url>\n    <loc>https://labola-clisson.fr/yoga-clisson/</loc>\n    <lastmod>2026-09-04</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>0.9</priority>\n    <image:image>\n      <image:loc>https://labola-clisson.fr/assets/images/catherine-yoga-1400.webp</image:loc>\n      <image:title>Yoga à Clisson</image:title>\n    </image:image>\n  </url>\n  <url>\n    <loc>https://labola-clisson.fr/danse-clisson/</loc>\n    <lastmod>2026-09-04</lastmod>\n    <changefreq>weekly</changefreq>\n    <priority>0.9</priority>\n    <image:image>\n      <image:loc>https://labola-clisson.fr/assets/images/danse-contemporaine-1400.webp</image:loc>\n      <image:title>Danse à Clisson</image:title>\n    </image:image>\n  </url>\n'''
              sm = sm.replace('</urlset>', additions + '</urlset>')
              sitemap.write_text(sm, encoding='utf-8')
          PY
      - name: Valider les fichiers
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          for p in ['yoga-clisson/index.html','danse-clisson/index.html']:
              text = Path(p).read_text(encoding='utf-8')
              assert '<link rel="canonical"' in text
              for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>', text, re.S):
                  json.loads(block)
          print('Validation OK')
          PY
      - name: Committer l’intégration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucune modification"
            exit 0
          fi
          git config user.name "Charles BERTHOU"
          git config user.email "cberthou@gmail.com"
          git add cours/index.html sitemap.xml
          git commit -m "Intègre les pages Yoga et Danse au maillage SEO"
          git push
