name: Correction temporaire architecture SEO

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replacer les pages SEO sous Cours
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          yoga_src = Path('yoga-clisson/index.html')
          danse_src = Path('danse-clisson/index.html')
          cours_file = Path('cours/index.html')
          sitemap_file = Path('sitemap.xml')

          yoga = yoga_src.read_text(encoding='utf-8')
          danse = danse_src.read_text(encoding='utf-8')

          yoga_new_url = 'https://labola-clisson.fr/cours/yoga-clisson/'
          danse_new_url = 'https://labola-clisson.fr/cours/danse-clisson/'

          yoga_nested = yoga.replace('https://labola-clisson.fr/yoga-clisson/', yoga_new_url)
          yoga_nested = yoga_nested.replace('href="/danse-clisson/"', 'href="/cours/danse-clisson/"')
          danse_nested = danse.replace('https://labola-clisson.fr/danse-clisson/', danse_new_url)
          danse_nested = danse_nested.replace('href="/yoga-clisson/"', 'href="/cours/yoga-clisson/"')

          Path('cours/yoga-clisson').mkdir(parents=True, exist_ok=True)
          Path('cours/danse-clisson').mkdir(parents=True, exist_ok=True)
          Path('cours/yoga-clisson/index.html').write_text(yoga_nested, encoding='utf-8')
          Path('cours/danse-clisson/index.html').write_text(danse_nested, encoding='utf-8')

          def redirect_page(title, target):
              return f'''<!doctype html>\n<html lang="fr">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>{title} | La Bola</title>\n  <meta name="robots" content="noindex,follow">\n  <link rel="canonical" href="{target}">\n  <meta http-equiv="refresh" content="0; url={target}">\n  <script>location.replace({target!r} + location.search + location.hash);</script>\n</head>\n<body>\n  <p>Cette page a été déplacée. <a href="{target}">Continuer vers la nouvelle adresse</a>.</p>\n</body>\n</html>\n'''

          yoga_src.write_text(redirect_page('Yoga à Clisson', '/cours/yoga-clisson/'), encoding='utf-8')
          danse_src.write_text(redirect_page('Danse à Clisson', '/cours/danse-clisson/'), encoding='utf-8')

          cours = cours_file.read_text(encoding='utf-8')
          cours = cours.replace('<a href="/yoga-clisson/"><strong>Cours de yoga à Clisson</strong>', '<a href="#famille-yoga"><strong>Cours de yoga à Clisson</strong>', 1)
          cours = cours.replace('<a href="/danse-clisson/"><strong>Cours de danse à Clisson</strong>', '<a href="#famille-danse"><strong>Cours de danse à Clisson</strong>', 1)

          def add_guide_link(text, section_id, href, label):
              start_marker = f'<section class="course-group" id="{section_id}">'
              start = text.find(start_marker)
              if start == -1:
                  raise SystemExit(f'Section introuvable: {section_id}')
              next_start = text.find('<section class="course-group"', start + len(start_marker))
              if next_start == -1:
                  next_start = len(text)
              segment = text[start:next_start]
              if href in segment:
                  return text
              grid = segment.find('<div class="practice-grid')
              if grid == -1:
                  raise SystemExit(f'Grille introuvable: {section_id}')
              insert = f'  <p><a class="card-link" href="{href}">{label}</a></p>\n'
              segment = segment[:grid] + insert + segment[grid:]
              return text[:start] + segment + text[next_start:]

          cours = add_guide_link(cours, 'famille-yoga', '/cours/yoga-clisson/', 'Guide des cours de yoga à Clisson')
          cours = add_guide_link(cours, 'famille-danse', '/cours/danse-clisson/', 'Guide des cours de danse à Clisson')
          cours_file.write_text(cours, encoding='utf-8')

          sitemap = sitemap_file.read_text(encoding='utf-8')
          sitemap = sitemap.replace('https://labola-clisson.fr/yoga-clisson/', yoga_new_url)
          sitemap = sitemap.replace('https://labola-clisson.fr/danse-clisson/', danse_new_url)
          sitemap_file.write_text(sitemap, encoding='utf-8')
          PY

      - name: Valider la correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          import xml.etree.ElementTree as ET

          ET.parse('sitemap.xml')

          for path, canonical in [
              ('cours/yoga-clisson/index.html', 'https://labola-clisson.fr/cours/yoga-clisson/'),
              ('cours/danse-clisson/index.html', 'https://labola-clisson.fr/cours/danse-clisson/')
          ]:
              text = Path(path).read_text(encoding='utf-8')
              assert f'<link rel="canonical" href="{canonical}">' in text
              assert '<meta name="robots" content="index,follow,max-image-preview:large">' in text
              for block in re.findall(r'<script type="application/ld\+json">(.*?)</script>', text, re.S):
                  json.loads(block)

          cours = Path('cours/index.html').read_text(encoding='utf-8')
          assert '<a href="#famille-yoga"><strong>Cours de yoga à Clisson</strong>' in cours
          assert '<a href="#famille-danse"><strong>Cours de danse à Clisson</strong>' in cours
          assert 'href="/cours/yoga-clisson/">Guide des cours de yoga à Clisson</a>' in cours
          assert 'href="/cours/danse-clisson/">Guide des cours de danse à Clisson</a>' in cours

          sm = Path('sitemap.xml').read_text(encoding='utf-8')
          assert '<loc>https://labola-clisson.fr/cours/yoga-clisson/</loc>' in sm
          assert '<loc>https://labola-clisson.fr/cours/danse-clisson/</loc>' in sm
          assert '<loc>https://labola-clisson.fr/yoga-clisson/</loc>' not in sm
          assert '<loc>https://labola-clisson.fr/danse-clisson/</loc>' not in sm

          for old, target in [
              ('yoga-clisson/index.html', '/cours/yoga-clisson/'),
              ('danse-clisson/index.html', '/cours/danse-clisson/')
          ]:
              text = Path(old).read_text(encoding='utf-8')
              assert '<meta name="robots" content="noindex,follow">' in text
              assert target in text

          print('Validation architecture SEO OK')
          PY

      - name: Committer la correction
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Aucune modification"
            exit 0
          fi
          git config user.name "Charles BERTHOU"
          git config user.email "cberthou@gmail.com"
          git add cours/index.html cours/yoga-clisson/index.html cours/danse-clisson/index.html yoga-clisson/index.html danse-clisson/index.html sitemap.xml
          git commit -m "Replace les pages Yoga et Danse sous Cours"
          git push
