name: Audit global temporaire

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-site.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auditer le site statique
        shell: python
        run: |
          from pathlib import Path
          from collections import Counter
          from urllib.parse import urlparse
          import json
          import re
          import xml.etree.ElementTree as ET

          root = Path('.')
          errors = []
          warnings = []

          forbidden = [
              'théâtre enfants',
              'méditation, théâtre',
              'danse, théâtre, chant',
              '/cours/danse-afrovibres-ade-adekambi/',
              '/assets/images/theatre-enfants',
          ]

          def target_for_root_url(value):
              path = value.split('#', 1)[0].split('?', 1)[0]
              if not path.startswith('/'):
                  return None
              if path == '/':
                  return root / 'index.html'
              p = root / path.lstrip('/')
              if path.endswith('/'):
                  p = p / 'index.html'
              return p

          html_files = sorted(root.rglob('*.html'))
          text_files = [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.html', '.txt', '.xml', '.js', '.css'} and '.git' not in p.parts and '.github' not in p.parts]

          # Références obsolètes.
          for path in text_files:
              text = path.read_text(encoding='utf-8')
              for needle in forbidden:
                  if needle in text:
                      errors.append(f'{path}: référence obsolète trouvée: {needle}')

          # HTML : structure, JSON-LD, IDs, liens et assets.
          attr_re = re.compile(r'(?:href|src)=["\']([^"\']+)["\']', re.I)
          srcset_re = re.compile(r'srcset=["\']([^"\']+)["\']', re.I)
          jsonld_re = re.compile(r'<script\s+type=["\']application/ld\+json["\']>(.*?)</script>', re.I | re.S)
          id_re = re.compile(r'\sid=["\']([^"\']+)["\']', re.I)

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              noindex = bool(re.search(r'<meta\s+name=["\']robots["\'][^>]*content=["\'][^"\']*noindex', text, re.I))

              if '<title>' not in text:
                  errors.append(f'{path}: title manquant')
              if not noindex:
                  if not re.search(r'<meta\s+name=["\']description["\']', text, re.I):
                      errors.append(f'{path}: meta description manquante')
                  if not re.search(r'<link\s+rel=["\']canonical["\']', text, re.I):
                      errors.append(f'{path}: canonical manquant')

              ids = id_re.findall(text)
              duplicates = [item for item, count in Counter(ids).items() if count > 1]
              if duplicates:
                  errors.append(f'{path}: IDs dupliqués: {duplicates}')

              for block_no, block in enumerate(jsonld_re.findall(text), start=1):
                  try:
                      json.loads(block)
                  except Exception as exc:
                      errors.append(f'{path}: JSON-LD #{block_no} invalide: {exc}')

              refs = attr_re.findall(text)
              for srcset in srcset_re.findall(text):
                  for candidate in srcset.split(','):
                      value = candidate.strip().split()[0] if candidate.strip() else ''
                      if value:
                          refs.append(value)

              for value in refs:
                  if value.startswith(('http://', 'https://', 'mailto:', 'tel:', 'javascript:', '#', '//', 'data:')):
                      continue
                  if not value.startswith('/'):
                      continue
                  target = target_for_root_url(value)
                  if target is not None and not target.exists():
                      errors.append(f'{path}: cible interne absente {value} -> {target}')

          # CSS : assets locaux référencés par url(...).
          css = root / 'assets/styles.css'
          if css.exists():
              text = css.read_text(encoding='utf-8')
              for value in re.findall(r'url\(([^)]+)\)', text):
                  value = value.strip(' \"\'')
                  if not value or value.startswith(('data:', 'http://', 'https://')):
                      continue
                  if value.startswith('/'):
                      target = target_for_root_url(value)
                  else:
                      target = css.parent / value
                  if target is not None and not target.exists():
                      errors.append(f'{css}: asset CSS absent {value}')

          # Sitemap : XML valide et URLs internes existantes.
          sitemap = root / 'sitemap.xml'
          try:
              tree = ET.parse(sitemap)
              ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9', 'img': 'http://www.google.com/schemas/sitemap-image/1.1'}
              for loc in tree.findall('.//sm:loc', ns):
                  value = (loc.text or '').strip()
                  parsed = urlparse(value)
                  if parsed.netloc == 'labola-clisson.fr':
                      target = target_for_root_url(parsed.path)
                      if target is not None and not target.exists():
                          errors.append(f'sitemap: page absente {value}')
              for loc in tree.findall('.//img:loc', ns):
                  value = (loc.text or '').strip()
                  parsed = urlparse(value)
                  if parsed.netloc == 'labola-clisson.fr':
                      target = target_for_root_url(parsed.path)
                      if target is not None and not target.exists():
                          errors.append(f'sitemap: image absente {value}')
          except Exception as exc:
              errors.append(f'sitemap.xml invalide: {exc}')

          # Fichiers essentiels.
          for required in ['index.html', 'cours/index.html', 'planning/index.html', 'intervenants/index.html', 'contact/index.html', 'actualites/index.html', 'location-salle/index.html', 'mentions-legales/index.html', 'robots.txt', 'sitemap.xml', 'CNAME', 'assets/styles.css']:
              if not (root / required).exists():
                  errors.append(f'fichier essentiel absent: {required}')

          print(f'{len(html_files)} fichiers HTML contrôlés')
          if warnings:
              print('Avertissements:')
              for item in warnings:
                  print('-', item)
          if errors:
              print('ERREURS:')
              for item in errors:
                  print('-', item)
              raise SystemExit(1)

          print('AUDIT OK : aucune anomalie détectée')
